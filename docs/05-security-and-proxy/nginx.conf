# Nginx Reverse Proxy Configuration for Jenkins
# Place in: /etc/nginx/sites-available/jenkins.conf
# Symlink to: /etc/nginx/sites-enabled/jenkins.conf

upstream jenkins_server {
    server 127.0.0.1:8080 fail_timeout=0;
}

# Redirect all HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ci.yourdomain.com;

    return 301 https://$host$request_uri;
}

# HTTPS Server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ci.yourdomain.com;

    # SSL Certificates (managed by Certbot or custom certificate paths)
    ssl_certificate /etc/letsencrypt/live/ci.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.yourdomain.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    location / {
        proxy_pass http://jenkins_server;
        proxy_redirect default;
        proxy_http_version 1.1;

        # Forwarded headers required by Jenkins
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support for CLI & Blue Ocean
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & timeout settings
        proxy_max_temp_file_size 0;
        client_max_body_size 100m;
        client_body_buffer_size 128k;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}
